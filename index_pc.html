<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>엔조이 공식 홈페이지 - 발자취</title>
    
    <!-- PC/모바일 분기 및 뷰포트 제어 스크립트 -->
    <script>
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            // 스마트폰 감지 (아이폰, 갤럭시 등 안드로이드 모바일. 태블릿 제외)
            var isSmartphone = /iphone|ipod|android.*mobile/.test(ua);
            
            // 데스크탑 모드로 접속 시 일반적으로 UA가 PC(Mac/Win)로 바뀌어 isSmartphone이 false가 됨
            if (isSmartphone) {
                // 일반 스마트폰 접속 시 모바일 버전 파일로 이동
                location.replace('index.html');
            } else {
                // PC, 태블릿, 혹은 데스크탑 모드로 강제 접속한 스마트폰 (현재 PC 파일 유지)
                // 터치 기기(태블릿, 폰)에서 PC버전을 볼 때 찌그러지지 않고 전체 화면이 축소되어 보이도록 뷰포트 강제 고정
                var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);
                if (isTouch) {
                    var vp = document.querySelector('meta[name="viewport"]');
                    if (vp) {
                        vp.content = 'width=1024, user-scalable=yes';
                    }
                }
            }
        })();
    </script>

    <!-- 운영체제의 라이트/다크 모드를 첫 화면부터 즉시 반영 -->
    <script>
        (function() {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.deviceTheme = prefersDark ? 'dark' : 'light';
        })();
    </script>

    <!-- 전역 에러 핸들러: 미리보기 환경의 크로스 도메인 스크립트 에러 방지 -->
    <script>
        window.addEventListener('error', function(e) {
            if (e.message === 'Script error.' || (e.message && e.message.includes('Script error'))) {
                console.warn('외부 스크립트(네이버 지도 API 등) 도메인 제한으로 인한 경고입니다. (정상 작동 중)');
                e.preventDefault();
            }
        });
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트 및 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" type="text/css"/>

    <style>

            color-scheme: light;
            --app-bg: #f5f7fa;
            --app-text: #1f2937;
            --app-text-strong: #0f172a;

            --app-line: rgba(15, 23, 42, 0.14);
            --app-line-soft: rgba(15, 23, 42, 0.10);
            --app-track: #d8dee7;
            --app-fill: #475569;
            --map-fallback: #eef2f6;
            --sheet-bg: rgba(255, 255, 255, 0.88);
            --sheet-border: rgba(15, 23, 42, 0.12);

            --sheet-control-bg: rgba(15, 23, 42, 0.07);
            --sheet-control-hover: rgba(15, 23, 42, 0.12);
            --lg-glass-border: rgba(255, 255, 255, 0.82);

        }

        :root[data-device-theme="dark"] {
            color-scheme: dark;
            --app-bg: #08090b;
            --app-text: #d7d8dc;
            --app-text-strong: #f4f4f5;
            --app-text-secondary: #b7bac1;
            --app-text-muted: #9ca0a9;
            --app-text-faint: #858a94;
            --app-line: #292b31;
            --app-line-soft: #23252b;
            --app-track: #292b31;
            --app-fill: #d4d6db;
            --map-fallback: #111214;
            --sheet-bg: rgba(28, 28, 30, 0.88);
            --sheet-border: rgba(255, 255, 255, 0.10);
            --sheet-shadow: 0 8px 32px rgba(0, 0, 0, 0.40);
            --sheet-control-bg: rgba(255, 255, 255, 0.10);
            --sheet-control-hover: rgba(255, 255, 255, 0.18);
            --lg-glass-border: rgba(255, 255, 255, 0.48);
            --lg-glass-inner-border: rgba(255, 255, 255, 0.20);
            --lg-glass-shadow: 0 14px 38px rgba(3, 8, 20, 0.24);
        }

        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "sans-serif";
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            touch-action: pan-y;
            background: var(--app-bg) !important;
            color: var(--app-text);
        }

        #mobile-wrapper {
            background: var(--app-bg) !important;
        }

        #map-screen,
        .map-fallback {
            background: var(--map-fallback) !important;
        }

        .map-fallback {
            color: var(--app-text-secondary);
        }

        .map-fallback p {
            color: var(--app-text-secondary) !important;
        }

        .map-fallback-icon {
            color: var(--app-text-faint) !important;
        }

        .map-fallback strong {
            color: var(--app-text-strong) !important;
        }

        /* 유리 재질 공통 클래스 */
        .toss-card {
            background: var(--sheet-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--sheet-border);
            border-radius: 24px;
            box-shadow: var(--sheet-shadow);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
        }

        #sheet-title {
            color: var(--app-text-strong) !important;
        }

        #sheet-desc {
            color: var(--app-text-secondary) !important;
        }

        .sheet-control {
            color: var(--app-text-secondary) !important;
            background: var(--sheet-control-bg) !important;
            border-color: var(--sheet-border) !important;
        }

        .sheet-control:hover {
            color: var(--app-text-strong) !important;
            background: var(--sheet-control-hover) !important;
        }
        
        #list-screen,
        #stats-screen {
            background: var(--app-bg);
        }

        .screen-kicker {
            color: var(--app-text-muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.18em;
        }

        .screen-description {
            color: var(--app-text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        .desktop-workspace,
        .stats-workspace {
            display: grid;
            grid-template-columns: clamp(240px, 18vw, 320px) minmax(0, 1fr);
            gap: clamp(36px, 4vw, 72px);
            width: 100%;
            padding: 32px clamp(24px, 2vw, 40px) 52px;
        }

        .desktop-sidebar,
        .stats-overview {
            position: sticky;
            top: 0;
            align-self: start;
            min-width: 0;
            min-height: calc(100dvh - 170px);
            padding: 8px clamp(24px, 2.4vw, 44px) 24px 0;
            border-right: 1px solid var(--app-line);
        }

        .desktop-main-pane,
        .stats-ranking {
            min-width: 0;
        }

        .desktop-title {
            color: var(--app-text-strong);
            font-size: clamp(30px, 2.4vw, 42px);
            font-weight: 900;
            letter-spacing: -0.055em;
            line-height: 1;
        }

        .screen-count {
            margin-top: 32px;
            text-align: left;
        }

        .screen-count strong {
            display: block;

            font-size: 48px;
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.9;
        }

        .screen-count span {

            margin-top: 9px;
            color: var(--app-text-faint);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .sidebar-section-label {

            padding-top: 22px;

            color: var(--app-text-faint);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        .year-quick-nav {
            margin-top: 9px;
        }

        .year-nav-button {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid var(--app-line-soft);
            color: var(--app-text-muted);
            text-align: left;
            transition: color 160ms ease, padding-left 160ms ease;
        }

        .year-nav-button:hover,
        .year-nav-button.is-active {
            color: var(--app-text-strong);
            padding-left: 6px;
        }

        .year-nav-button strong {
            font-size: 14px;
            font-weight: 850;
        }

        .year-nav-button span {
            font-size: 10px;
            font-weight: 700;
        }

        .record-item {
            position: relative;
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr);
            gap: 14px;
        }

        .record-item:not(:last-child)::before {
            content: "";
            position: absolute;
            top: 29px;
            bottom: -18px;
            left: 18px;
            width: 1px;
            background: var(--app-line);
        }

        .record-index {
            position: relative;
            z-index: 1;
            width: 38px;
            height: 29px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--app-text-muted);
            font-size: 12px;
            font-weight: 800;
        }

        .record-panel {
            padding: 0 0 18px;
            border-bottom: 1px solid var(--app-line);
            transition: opacity 160ms ease;
        }

        .record-panel:active {
            opacity: 0.68;
        }

        .record-logo {
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
            overflow: hidden;
            border-radius: 15px;
        }

        .record-panel-grid {
            display: grid;
            grid-template-columns: 48px minmax(150px, 0.72fr) minmax(220px, 1.28fr) 16px;
            align-items: center;
            gap: 16px;
        }

        .record-copy {
            min-width: 0;
            padding-left: 18px;
            border-left: 1px solid var(--app-line);
        }

        .record-date {
            color: var(--app-text-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .record-region {
            color: var(--app-text-strong);
            font-size: 16px;
            font-weight: 800;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .record-title {
            color: var(--app-text);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .record-description {
            margin-top: 6px;
            color: var(--app-text-muted);
            font-size: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .record-arrow {
            color: var(--app-text-faint);
            font-size: 12px;
        }

        .record-year-group {
            border-bottom: 1px solid var(--app-line);
        }

        #travel-list-container {
            min-width: 0;
        }

        .record-year-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 22px 0;
            cursor: pointer;
            list-style: none;
        }

        .record-year-summary::after {
            content: "";
            flex: 1;
            height: 1px;
            margin: 0 12px;
            background: var(--app-line);
        }

        .record-year-summary::-webkit-details-marker {
            display: none;
        }

        .record-year-title {
            color: var(--app-text-strong);
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .record-year-count {
            color: var(--app-text-muted);
            font-size: 11px;
            font-weight: 700;
        }

        .record-year-chevron {
            color: var(--app-text-muted);
            font-size: 12px;
            transition: transform 180ms ease;
        }

        .record-year-group[open] .record-year-chevron {
            transform: rotate(180deg);
        }

        .record-year-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
            gap: 0 clamp(30px, 3vw, 52px);
            padding: 2px 0 22px;
            border-top: 1px solid var(--app-line-soft);
        }

        .record-month-group {
            padding-top: 22px;
        }

        .record-month-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .record-month-heading::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--app-line);
        }

        .record-month-title {
            color: var(--app-text-secondary);
            font-size: 13px;
            font-weight: 800;
        }

        .record-month-list {
            display: grid;
            gap: 18px;
        }

        .record-status {
            display: inline-flex;
            align-items: center;
            min-height: 19px;
            padding: 0 2px;
            color: var(--app-text-secondary);
            font-size: 9px;
            font-weight: 800;
        }

        .stats-overview-title {
            color: var(--app-text-strong);
            font-size: clamp(30px, 2.4vw, 42px);
            font-weight: 900;
            letter-spacing: -0.055em;
            line-height: 1;
        }

        .stats-hero-number {
            color: var(--app-text-strong);
            font-size: clamp(66px, 5.8vw, 92px);
            font-weight: 900;
            letter-spacing: -0.07em;
            line-height: 0.95;
        }

        .stats-metric-grid {
            margin-top: 30px;
            border-top: 1px solid var(--app-line);
        }

        .stats-metric {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 14px;
            min-width: 0;
            padding: 15px 0;
            text-align: left;
        }

        .stats-metric + .stats-metric {
            border-top: 1px solid var(--app-line-soft);
        }

        .stats-metric strong {
            grid-column: 2;
            grid-row: 1;
            color: var(--app-text-strong);
            font-size: 18px;
            font-weight: 850;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .stats-metric span {
            grid-column: 1;
            grid-row: 1;
            color: var(--app-text-muted);
            font-size: 12px;
        }

        .stats-section-title {
            color: var(--app-text-strong);
            font-size: 17px;
            font-weight: 800;
        }

        .ranking-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 clamp(30px, 3vw, 54px);
        }

        .ranking-row {
            padding: 16px 0;
            border-bottom: 1px solid var(--app-line-soft);
        }

        .ranking-row + .ranking-row {
            border-top: 0;
        }

        .ranking-number {
            width: 28px;
            color: var(--app-text-muted);
            font-size: 12px;
            font-weight: 800;
        }

        .ranking-region {
            min-width: 0;
            color: var(--app-text);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .ranking-count {
            color: var(--app-text-secondary);
            font-size: 12px;
            font-weight: 700;
        }

        .ranking-track {
            height: 3px;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--app-track);
        }

        .ranking-fill {
            height: 100%;
            border-radius: inherit;
            background: var(--app-fill);
        }

        .stats-total-unit,
        .stats-region-total {
            color: var(--app-text-muted);
        }

        .theme-accent-orange { color: #c2410c; }
        .theme-accent-purple { color: #7e22ce; }
        .theme-accent-red { color: #b91c1c; }
        .theme-accent-yellow { color: #854d0e; }
        .theme-accent-blue { color: #1d4ed8; }
        .theme-accent-green { color: #166534; }

        :root[data-device-theme="dark"] .theme-accent-orange { color: #fb923c; }
        :root[data-device-theme="dark"] .theme-accent-purple { color: #c084fc; }
        :root[data-device-theme="dark"] .theme-accent-red { color: #f87171; }
        :root[data-device-theme="dark"] .theme-accent-yellow { color: #facc15; }
        :root[data-device-theme="dark"] .theme-accent-blue { color: #60a5fa; }
        :root[data-device-theme="dark"] .theme-accent-green { color: #4ade80; }

        .text-main { color: var(--app-text-strong); }
        .text-sub { color: var(--app-text-secondary); }

        /* 상단바에만 적용하는 무색 Liquid Glass */
        .liquid-glass-control {
            position: relative;
            overflow: hidden;
            background: transparent;
            border: 1px solid var(--lg-glass-border);
            box-shadow: var(--lg-glass-shadow);
        }

        .liquid-glass-control::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: transparent;
            backdrop-filter: blur(var(--lg-blur)) saturate(1.65) contrast(1.04);
            -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(1.65) contrast(1.04);
            pointer-events: none;
        }

        .liquid-glass-control::after {
            content: "";
            position: absolute;
            inset: 1px;
            border: 1px solid var(--lg-glass-inner-border);
            border-radius: inherit;
            pointer-events: none;
        }

        #top-nav .liquid-glass-control > * {
            position: relative;
            z-index: 1;
        }

        #top-nav-main,
        #map-controls-btn {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #top-nav-title,
        #top-nav .pc-nav-item,
        #top-nav .map-control {
            transition: color 0.3s ease, opacity 0.25s ease, transform 0.2s ease;
        }

        .adaptive-muted {
            opacity: 0.64;
        }

        #top-nav .pc-nav-item {
            position: relative;
            min-width: 48px;
            padding: 8px 14px;
            border-radius: 999px;
            opacity: 0.64;
        }

        #top-nav .pc-nav-item > span {
            position: relative;
            z-index: 1;
        }

        #top-nav .pc-nav-item::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255,255,255,0.68);
            border-radius: inherit;
            background: rgba(255,255,255,0.38);
            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.72),
                0 5px 16px rgba(4, 10, 22, 0.18);
            backdrop-filter: blur(14px) saturate(1.5);
            -webkit-backdrop-filter: blur(14px) saturate(1.5);
            opacity: 0;
            transition: opacity 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        #top-nav .pc-nav-item:hover,
        #top-nav .pc-nav-item.is-active {
            opacity: 1;
        }

        #top-nav .pc-nav-item.is-active::before {
            opacity: 1;
        }

        #mobile-wrapper[data-chrome-ink="dark"] .adaptive-contrast,
        #mobile-wrapper[data-chrome-ink="dark"] #top-nav .pc-nav-item,
        #mobile-wrapper[data-chrome-ink="dark"] #top-nav .map-control {
            color: rgba(8, 15, 28, 0.94) !important;
        }

        #mobile-wrapper[data-chrome-ink="light"] .adaptive-contrast,
        #mobile-wrapper[data-chrome-ink="light"] #top-nav .pc-nav-item,
        #mobile-wrapper[data-chrome-ink="light"] #top-nav .map-control {
            color: rgba(255, 255, 255, 0.96) !important;
        }

        #mobile-wrapper[data-chrome-ink="dark"] #top-nav .pc-nav-item::before {
            background: rgba(255,255,255,0.48);
            border-color: rgba(255,255,255,0.78);
        }

        #mobile-wrapper[data-chrome-ink="light"] #top-nav .pc-nav-item::before {
            background: rgba(255,255,255,0.30);
            border-color: rgba(255,255,255,0.58);
        }

        #top-nav .glass-divider {
            background: rgba(255, 255, 255, 0.42);
            box-shadow: 0 0 0.5px rgba(0, 0, 0, 0.28);
        }

        @media (max-width: 1180px) {
            .desktop-workspace,
            .stats-workspace {
                grid-template-columns: 220px minmax(0, 1fr);
                gap: 30px;
            }

            .desktop-sidebar,
            .stats-overview {
                padding-right: 26px;
            }

            .record-year-content,
            .ranking-list {
                grid-template-columns: 1fr;
            }
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* 커스텀 마커 스타일 */
        .travel-marker {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: transform 0.2s;
            /* 명시적 크기 지정으로 위치 틀어짐 방지 */
            width: 40px;
            height: 48px;

        function updateChromeContrast() {
            const wrapper = document.getElementById('mobile-wrapper');
            if (!wrapper) return;

            // 지도에서는 지도 종류를, 목록/통계에서는 기기의 색상 모드를 기준으로 대비를 맞춘다.
            const useLightInk = activeTabIndex === 0 ? isSatellite : isDeviceDarkMode();
            wrapper.dataset.chromeInk = useLightInk ? 'light' : 'dark';
        }

        // 탭 전환 로직
        function switchTab(index) {
            if (navigator.vibrate) navigator.vibrate(10);
            activeTabIndex = index;
            updateChromeContrast();

            const screens = [
                document.getElementById('map-screen'),
                document.getElementById('list-screen'),
                document.getElementById('stats-screen')
            ];
            
            screens.forEach((screen, i) => {
                if (i === index) {
                    screen.classList.remove('hidden');
                    screen.classList.add('flex');
                } else {
                    screen.classList.add('hidden');
                    screen.classList.remove('flex');
                }
            });

            // 상단 네비게이션 선택 상태 조정
            const navButtons = document.querySelectorAll('#top-nav button.nav-item');
            
            navButtons.forEach((btn, i) => {
                const isActive = i === index;
                btn.classList.toggle('is-active', isActive);
                btn.setAttribute('aria-current', isActive ? 'page' : 'false');
            });

            // 좌측 타이틀 동적 변경
            const topNavTitle = document.getElementById('top-nav-title');
            if (topNavTitle) {
                if (index === 0) {
                    topNavTitle.innerHTML = `<strong class="text-[16px] tracking-tight whitespace-nowrap">엔조이 여행 지도</strong><span class="adaptive-muted text-[12px] font-medium hidden sm:inline-block ml-3 whitespace-nowrap">전국 226개 지역 중 11개 채움</span>`;
                } else if (index === 1) {
                    topNavTitle.innerHTML = `<strong class="text-[16px] tracking-tight whitespace-nowrap">엔조이 여행 지도</strong><span class="adaptive-muted mx-3">/</span><span class="text-[14px] font-bold">목록</span>`;
                } else if (index === 2) {
                    topNavTitle.innerHTML = `<strong class="text-[16px] tracking-tight whitespace-nowrap">엔조이 여행 지도</strong><span class="adaptive-muted mx-3">/</span><span class="text-[14px] font-bold">통계</span>`;
                }
            }

            // 지도 화면에서만 우측 미니 컨트롤을 표시한다.
            const mapControlsBtn = document.getElementById('map-controls-btn');
            if (mapControlsBtn) {
                if (index === 0) {
                    mapControlsBtn.style.maxWidth = '280px';
                    mapControlsBtn.style.padding = '10px 20px';
                    mapControlsBtn.style.opacity = '1';
                    mapControlsBtn.style.marginLeft = '10px';
                    mapControlsBtn.style.borderWidth = '1px';
                } else {
                    mapControlsBtn.style.maxWidth = '0px';
                    mapControlsBtn.style.padding = '0px';
                    mapControlsBtn.style.opacity = '0';
                    mapControlsBtn.style.marginLeft = '0px';
                    mapControlsBtn.style.borderWidth = '0px';
                }
            }

            if (index === 0 && map) {
                window.dispatchEvent(new Event('resize'));
            }
            
            if (index === 1) {
                renderTravelList();
            } else if (index === 2) {
                renderStats(); // 통계 탭을 누르면 통계 데이터 렌더링
            }
        }

        // 지도 초기화
        function initMap() {
            if (typeof naver === 'undefined' || typeof naver.maps === 'undefined' || typeof naver.maps.LatLng === 'undefined') {
                console.warn("네이버 지도 API를 불러올 수 없습니다. (미리보기 환경 등 도메인 미등록 상태)");
                return;
            }

            const centerLocation = new naver.maps.LatLng(36.3504, 127.3845);
            
            const mapOptions = {
                center: centerLocation,
                zoom: 7,
                scaleControl: false,
                logoControl: true,
                logoControlOptions: { position: naver.maps.Position.BOTTOM_LEFT },
                mapDataControl: false,
                zoomControl: false,
            };

            map = new naver.maps.Map('map', mapOptions);
            
            naver.maps.Event.addListener(map, 'click', function() {
                closeBottomSheet();
            });

            createMarkers();

            // --- 땅 모양(행정구역 경계선) 색칠 ---
            loadRegionBoundaries();
        }

        // --- 실제 행정구역 GeoJSON 데이터를 불러와서 그립니다 ---
        function loadRegionBoundaries() {
            if (!map || typeof naver === 'undefined' || !naver.maps) return;

            const provinceUrl = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_provinces_geo_simple.json';
            const municipalityUrl = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/skorea_municipalities_geo_simple.json';

            // 2026년 최신 경계에서 추출한 대구광역시 전체 외곽선(군위군 포함)을 먼저 표시한다.
            map.data.addGeoJson({
                type: 'FeatureCollection',
                features: [currentDaeguBoundary]
            });

            Promise.all([
                fetch(provinceUrl).then(response => {
                    if (!response.ok) throw new Error(`시도 경계 요청 실패: ${response.status}`);
                    return response.json();
                }),
                fetch(municipalityUrl).then(response => {
                    if (!response.ok) throw new Error(`시군구 경계 요청 실패: ${response.status}`);
                    return response.json();
                })
            ])
                .then(([provinceGeojson, municipalityGeojson]) => {
                    map.data.addGeoJson({
                        ...provinceGeojson,
                        features: provinceGeojson.features.filter(feature => feature.properties?.name !== '대구광역시')
                    });
                    map.data.addGeoJson({
                        ...municipalityGeojson,
                        features: municipalityGeojson.features.filter(feature => feature.properties?.name !== '군위군')
                    });

                    applyMapStyle();
                })
                .catch(e => console.warn('행정구역 경계 오류:', e));

            applyMapStyle();

            // 통합 스타일 적용 함수
            function applyMapStyle() {
                map.data.setStyle(function(feature) {
                    const name = feature.getProperty('name') || '';
                    let color = null;

                    // 군위군은 대구광역시 경계에 합쳐 하나의 폴리곤으로 표시한다.
                    if (name === '대구광역시') color = colorThemes.red.markerBg;
                    else if (name === '대전광역시') color = colorThemes.yellow.markerBg;
                    else if (name === '제주특별자치도') color = colorThemes.orange.markerBg;
                    else if (name === '진주시') color = colorThemes.purple.markerBg;
                    else if (name === '칠곡군') color = colorThemes.blue.markerBg;
                    else if (name === '구미시') color = colorThemes.green.markerBg;
                    else if (name === '청양군') color = colorThemes.red.markerBg;
                    else if (name === '파주시') color = colorThemes.blue.markerBg;
                    else if (name === '강릉시') color = colorThemes.blue.markerBg;
                    else if (name === '원주시') color = colorThemes.purple.markerBg;

                    if (color) {
                        return {
                            fillColor: color,
                            fillOpacity: 0.15, // 반투명 색칠
                            strokeColor: color,
                            strokeWeight: 2,
                            strokeOpacity: 0.7,
                            clickable: false // 폴리곤 클릭 시 지도 클릭 이벤트 방해 방지
                        };
                    } else {
                        // 여행하지 않은 다른 모든 지역의 폴리곤은 투명하게(숨김) 처리
                        return { visible: false };
                    }
                });
            }
        }

        function getTripLogoMarkup(trip, imageClass = 'w-full h-full object-cover rounded-full') {
            if (trip.emoji) {
                return `<span aria-hidden="true" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;">${trip.emoji}</span>`;
            }

            return `<img src="${trip.logo}" alt="logo" class="${imageClass}">`;
        }

        // 마커 생성
        function createMarkers() {
            if (!map || typeof naver === 'undefined' || !naver.maps) return;

            travelData.forEach((trip, index) => {
                const position = new naver.maps.LatLng(trip.lat, trip.lng);
                const theme = colorThemes[trip.color] || colorThemes.blue;

                const markerHtml = `
                    <div id="marker-${index}" class="travel-marker">
                        <div class="travel-marker-label" style="display:none;">${trip.region}</div>
                        <div class="travel-marker-icon overflow-hidden" style="background-color: ${theme.markerBg}; padding: 2px;">
                            ${getTripLogoMarkup(trip)}
                        </div>
                        <div class="travel-marker-tail" style="border-top-color: ${theme.markerBg};"></div>
                    </div>
                `;

                const marker = new naver.maps.Marker({
                    position: position,
                    map: map,
                    icon: {
                        content: markerHtml,
                        size: new naver.maps.Size(40, 48),
                        anchor: new naver.maps.Point(20, 48)
                    },
                    zIndex: 10,
                    visible: isMarkerVisible
                });

                markers.push(marker);

                naver.maps.Event.addListener(marker, 'click', function(e) {
                    if (navigator.vibrate) navigator.vibrate(5);
                    focusMarker(index);
                });
            });
        }

        function focusMarker(index) {
            if (activeMarkerIndex !== -1 && markers[activeMarkerIndex]) {
                const prevEl = document.getElementById(`marker-${activeMarkerIndex}`);
                if (prevEl) {
                    prevEl.classList.remove('active');
                    prevEl.querySelector('.travel-marker-label').style.display = 'none';
                }
                if (typeof markers[activeMarkerIndex].setZIndex === 'function') {
                    markers[activeMarkerIndex].setZIndex(10);
                }
            }

            activeMarkerIndex = index;
            const trip = travelData[index];
            const marker = markers[index];

            const el = document.getElementById(`marker-${index}`);
            if (el) {
                el.classList.add('active');
                el.querySelector('.travel-marker-label').style.display = 'block';
            }
            
            if (marker && typeof marker.setZIndex === 'function') {
                marker.setZIndex(100);
            }

            if (map && typeof map.morph === 'function' && marker) {
                map.morph(marker.getPosition(), 10, { duration: 300 });
            }

            const theme = colorThemes[trip.color] || colorThemes.blue;
            document.getElementById('sheet-emoji').innerHTML = getTripLogoMarkup(trip);
            document.getElementById('sheet-emoji').className = `w-12 h-12 rounded-full ${theme.bg} flex items-center justify-center border ${theme.border} overflow-hidden p-0.5`;
            
            document.getElementById('sheet-date').innerText = trip.date;
            document.getElementById('sheet-date').className = `text-[10px] font-bold ${theme.text} ${theme.bg} px-2 py-0.5 rounded-full`;
            
            document.getElementById('sheet-title').innerText = trip.title;
            document.getElementById('sheet-desc').innerText = trip.desc;

            const sheet = document.getElementById('bottom-sheet');
            if (sheet) sheet.classList.add('show');
        }

        function closeBottomSheet() {
            const sheet = document.getElementById('bottom-sheet');
            if (sheet) sheet.classList.remove('show');
            
            if (activeMarkerIndex !== -1 && markers[activeMarkerIndex]) {
                const el = document.getElementById(`marker-${activeMarkerIndex}`);
                if (el) {
                    el.classList.remove('active');
                    el.querySelector('.travel-marker-label').style.display = 'none';
                }
                if (typeof markers[activeMarkerIndex].setZIndex === 'function') {
                    markers[activeMarkerIndex].setZIndex(10);
                }
                activeMarkerIndex = -1;
            }
        }

        // --- 마커 보이기/숨기기 기능 ---
        function toggleMarkers() {
            if (navigator.vibrate) navigator.vibrate(5);
            isMarkerVisible = !isMarkerVisible; // 상태 반전
            
            markers.forEach(marker => {
                if (marker) {
                    marker.setVisible(isMarkerVisible); // 네이버 지도 API의 마커 숨김 기능
                }
            });

            // 아이콘 변경 (눈 모양 <-> 감은 눈 모양)
            const icon = document.querySelector('#marker-toggle-btn i');
            if (icon) {
                icon.className = isMarkerVisible ? 'fa-solid fa-eye text-sm' : 'fa-solid fa-eye-slash text-sm';
            }
            const markerButton = document.getElementById('marker-toggle-btn');
            if (markerButton) {
                markerButton.setAttribute('aria-pressed', String(isMarkerVisible));
            }
        }

        // --- 위성 지도 토글 기능 ---
        function toggleSatellite() {
            if (navigator.vibrate) navigator.vibrate(5);
            isSatellite = !isSatellite;

            const btn = document.getElementById('satellite-toggle-btn');
            if (btn) {
                btn.setAttribute('aria-pressed', String(isSatellite));
            }

            // 지도 타입 변경 (HYBRID: 위성 사진 + 도로/지명 표시)
            if (map && typeof naver !== 'undefined' && naver.maps) {
                map.setMapTypeId(isSatellite ? naver.maps.MapTypeId.HYBRID : naver.maps.MapTypeId.NORMAL);
            }
            updateChromeContrast();
        }

        function zoomToAll() {
            if (navigator.vibrate) navigator.vibrate(5);
            closeBottomSheet();
            if (map && typeof map.morph === 'function' && typeof naver !== 'undefined' && naver.maps) {
                map.morph(new naver.maps.LatLng(36.3504, 127.3845), 7, { duration: 400 });
            }
        }

        function renderTravelList() {
            const container = document.getElementById('travel-list-container');
            if (!container) return;
            container.innerHTML = '';

            const count = document.getElementById('record-count');
            if (count) count.textContent = travelData.length;
            const yearNav = document.getElementById('record-year-nav');
            if (yearNav) yearNav.innerHTML = '';

            const currentYear = new Date().getFullYear();
            const yearGroups = new Map();

            travelData.forEach((trip, tripIndex) => {
                const meta = getTripDateMeta(trip);
                const year = meta.year;
                const monthKey = meta.month ? `month-${meta.month}` : `period-${meta.periodLabel}`;
                const monthLabel = meta.month ? `${meta.month}월` : meta.periodLabel;

                if (!yearGroups.has(year)) yearGroups.set(year, new Map());
                const monthGroups = yearGroups.get(year);
                if (!monthGroups.has(monthKey)) {
                    monthGroups.set(monthKey, { label: monthLabel, trips: [] });
                }
                monthGroups.get(monthKey).trips.push({ trip, tripIndex });
            });

            const sortedYearGroups = Array.from(yearGroups.entries())
                .sort((a, b) => b[0] - a[0]);
            const detailByYear = new Map();

            const syncYearNavigation = () => {
                if (!yearNav) return;
                yearNav.querySelectorAll('[data-year-target]').forEach(button => {
                    const details = detailByYear.get(Number(button.dataset.yearTarget));
                    button.classList.toggle('is-active', Boolean(details && details.open));
                    button.setAttribute('aria-pressed', String(Boolean(details && details.open)));
                });
            };

            sortedYearGroups
                .forEach(([year, monthGroups]) => {
                    const tripCount = Array.from(monthGroups.values())
                        .reduce((sum, group) => sum + group.trips.length, 0);
                    const yearDetails = document.createElement('details');
                    yearDetails.className = 'record-year-group';
                    yearDetails.dataset.year = year;
                    yearDetails.open = year === currentYear;
                    detailByYear.set(year, yearDetails);

                    const monthMarkup = Array.from(monthGroups.values()).map(group => `
                        <section class="record-month-group">
                            <div class="record-month-heading">
                                <h3 class="record-month-title">${group.label}</h3>
                            </div>
                            <div class="record-month-list">
                                ${group.trips.map(({ trip, tripIndex }) => `
                                    <div class="record-item">
                                        <div class="record-index">${String(tripSequenceById.get(trip.id)).padStart(2, '0')}</div>
                                        <button type="button" class="record-panel w-full text-left" data-trip-index="${tripIndex}" aria-label="${trip.region} 여행 기록을 지도에서 보기">
                                            <div class="record-panel-grid">
                                                <div class="record-logo">
                                                    ${getTripLogoMarkup(trip, 'w-full h-full object-cover')}
                                                </div>
                                                <div class="min-w-0 flex-1">
                                                    <div class="flex items-center gap-2">
                                                        <div class="record-date">${trip.date}</div>
                                                        ${trip.status === 'upcoming' ? '<span class="record-status">예정</span>' : ''}
                                                    </div>
                                                    <div class="record-region mt-1">${trip.region}</div>
                                                </div>
                                                <div class="record-copy">
                                                    <p class="record-title">${trip.title}</p>
                                                    <p class="record-description break-keep">${trip.desc}</p>
                                                </div>
                                                <i class="record-arrow fa-solid fa-arrow-up-right-from-square"></i>
                                            </div>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `).join('');

                    yearDetails.innerHTML = `
                        <summary class="record-year-summary">
                            <div>
                                <div class="record-year-title">${year}</div>
                                <div class="record-year-count mt-1">${tripCount}개의 여행 기록</div>
                            </div>
                            <i class="record-year-chevron fa-solid fa-chevron-down"></i>
                        </summary>
                        <div class="record-year-content">${monthMarkup}</div>
                    `;

                    yearDetails.querySelectorAll('[data-trip-index]').forEach(panel => {
                        panel.addEventListener('click', () => {
                            const tripIndex = Number(panel.dataset.tripIndex);
                            if (navigator.vibrate) navigator.vibrate(10);
                            switchTab(0);
                            setTimeout(() => { focusMarker(tripIndex); }, 300);
                        });
                    });

                    yearDetails.addEventListener('toggle', syncYearNavigation);
                    container.appendChild(yearDetails);

                    if (yearNav) {
                        const yearButton = document.createElement('button');
                        yearButton.type = 'button';
                        yearButton.className = 'year-nav-button';
                        yearButton.dataset.yearTarget = year;
                        yearButton.setAttribute('aria-pressed', String(year === currentYear));
                        yearButton.innerHTML = `<strong>${year}</strong><span>${tripCount} records</span>`;
                        yearButton.addEventListener('click', () => {
                            container.querySelectorAll('.record-year-group').forEach(details => {
                                details.open = details === yearDetails;
                            });
                            yearDetails.scrollIntoView({ block: 'start', behavior: 'auto' });
                            syncYearNavigation();
                        });
                        yearNav.appendChild(yearButton);
                    }
                });

            syncYearNavigation();
        }

        // 통계 렌더링
        function renderStats() {
            const container = document.getElementById('stats-container');
            if (!container) return;

            let totalTrips = travelData.length;
            let totalDays = 0;
            let regionCounts = {};

            // 데이터 분석
            travelData.forEach(trip => {
                // 1. 지역 카운트
                let region = trip.region;
                regionCounts[region] = (regionCounts[region] || 0) + 1;

                // 2. 여행 일수 계산 (예: '2024.10.30 ~ 11.02')
                if (trip.date.includes('~')) {
                    let parts = trip.date.split('~').map(s => s.trim());
                    let startStr = parts[0].replace(/\./g, '-');
                    let endStr = parts[1];
                    // 연도가 생략된 경우 (예: '08.30') 앞에 연도 붙여주기
                    if (endStr.length <= 5) { 
                        endStr = parts[0].substring(0, 5) + endStr; 
                    }
                    endStr = endStr.replace(/\./g, '-');
                    
                    let start = new Date(startStr);
                    let end = new Date(endStr);
                    let days = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
                    totalDays += (isNaN(days) ? 1 : days);
                } else {
                    // 당일치기
                    totalDays += 1;
                }
            });

            // 가장 많이 간 지역 찾기 (내림차순 정렬)
            let sortedRegions = Object.entries(regionCounts).sort((a, b) => b[1] - a[1]);
            let favoriteRegion = sortedRegions.length > 0 ? sortedRegions[0][0] : '-';
            // 이름이 길면 마지막 단어만 추출 (예: '경상북도 구미시' -> '구미시')
            let shortFavoriteRegion = favoriteRegion.split(' ').pop();
            let uniqueRegions = sortedRegions.length;
            let maxVisits = sortedRegions.length > 0 ? sortedRegions[0][1] : 1;

            container.innerHTML = `
                <div class="stats-workspace">
                    <aside class="stats-overview">
                        <p class="screen-kicker mb-3">JOURNEY INSIGHT</p>
                        <h2 class="stats-overview-title">여행 요약</h2>
                        <p class="screen-description mt-4">숫자로 다시 보는 우리의 발자취예요.</p>
                        <div class="flex items-end gap-3 mt-10">
                            <strong class="stats-hero-number">${totalTrips}</strong>
                            <span class="stats-total-unit text-sm font-bold mb-1">번의 여행</span>
                        </div>
                        <div class="stats-metric-grid">
                            <div class="stats-metric">
                                <strong>${totalDays}</strong>
                                <span>여행 일수</span>
                            </div>
                            <div class="stats-metric">
                                <strong>${uniqueRegions}</strong>
                                <span>방문 지역</span>
                            </div>
                            <div class="stats-metric">
                                <strong>${shortFavoriteRegion}</strong>
                                <span>최다 방문</span>
                            </div>
                        </div>
                    </aside>

                    <section class="stats-ranking">
                        <div class="flex items-end justify-between mb-5 px-1">
                            <div>
                                <p class="screen-kicker mb-1.5">DESTINATIONS</p>
                                <h3 class="stats-section-title">지역별 방문 순위</h3>
                            </div>
                            <span class="stats-region-total text-[11px] font-medium">${uniqueRegions}개 지역</span>
                        </div>

                        <div class="ranking-list">
                            ${sortedRegions.map((r, i) => `
                                <div class="ranking-row">
                                    <div class="flex items-center gap-3">
                                        <span class="ranking-number">${String(i + 1).padStart(2, '0')}</span>
                                        <span class="ranking-region flex-1">${r[0]}</span>
                                        <span class="ranking-count">${r[1]}회</span>
                                    </div>
                                    <div class="ranking-track">
                                        <div class="ranking-fill" style="width: ${Math.max(12, (r[1] / maxVisits) * 100)}%;"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                </div>
            `;
        }

        // 초기 실행
        window.onload = () => {
            syncDeviceTheme();
            switchTab(0);
            initMap();
        };
    </script>
</body>
</html>
